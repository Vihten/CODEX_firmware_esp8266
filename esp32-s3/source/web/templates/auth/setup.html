<h2>Створити пароль</h2>
<p>Задайте пароль для доступу до налаштувань контролера.</p>
<form method='post' action='/auth/setup'>
<input type='hidden' name='csrf' value='{{csrf}}'>
<label>Новий пароль<input type='password' name='new_password' autocomplete='new-password' aria-describedby='password-rule' minlength='10' maxlength='128' required></label>
<small id='password-rule'>Щонайменше 10 символів. Максимум 128 латинських або 64 українські літери.</small>
<label>Повторіть пароль<input type='password' name='confirm_password' autocomplete='new-password' maxlength='128' required></label>
<button type='submit'>Зберегти пароль</button>
</form>
