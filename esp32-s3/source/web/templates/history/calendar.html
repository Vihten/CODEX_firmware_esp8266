<section class="section token-history" id="token-history" aria-labelledby="token-history-heading">
  <div class="section-head"><h2 id="token-history-heading">Токени за тиждень</h2><button type="button" class="secondary" data-history-refresh>Оновити історію</button></div>
  <div class="token-history-summary"><span class="muted" data-history-range>Поточний тиждень · усі агенти</span><strong data-history-week-total></strong></div>
  <p class="muted" data-history-status role="status" aria-live="polite">Завантаження історії…</p>
  <noscript><p>Увімкніть JavaScript, щоб переглядати історію токенів.</p></noscript>
  <div class="token-history-calendar">
    <div class="token-history-grid" data-history-grid role="group" aria-label="Токени за днями поточного тижня"></div>
    <div class="token-history-details" id="token-history-tooltip" data-history-details role="tooltip" hidden>
      <strong data-history-day></strong><p data-history-day-value></p><p class="muted" data-history-day-quota></p>
    </div>
  </div>
  <p class="muted token-history-hint">Темно-синій — менше токенів, світлий — більше. Наведіть або натисніть на день для деталей.</p>
</section>
