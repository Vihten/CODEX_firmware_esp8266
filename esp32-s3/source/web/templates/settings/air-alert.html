<section class='section' aria-labelledby='air-alert-heading'>
  <div class='section-head'><h2 id='air-alert-heading'>Повітряна тривога</h2></div>
  <p class='muted'>Вінницький район · Джерело: <a href='https://neptun.in.ua/' target='_blank' rel='noopener noreferrer'>NEPTUN</a></p>
  <form id='air-alert-settings' method='post' action='/air-alert'>
    <label class='checkbox-label'><input type='checkbox' name='enabled' value='1' {{0}}>Індикація тривоги у верхніх кутах</label>
    <button type='submit' name='mode' value='save'>Зберегти</button>
  </form>
  <p class='muted' data-air-alert-note role='status'>{{3}}</p>
  <p data-air-alert-state role='status'>{{1}}</p>
  <p class='muted' data-air-alert-updated>{{6}}</p>
  <form method='post' action='/air-alert'>
    <div class='actions'>
      <button type='submit' name='mode' value='yellow' data-air-alert-play {{4}}>Жовтий тест · 60 с</button>
      <button type='submit' name='mode' value='red' data-air-alert-play {{4}}>Червоний тест · 60 с</button>
      <button type='submit' name='mode' value='stop' class='secondary' data-air-alert-stop {{5}}>Зупинити тест</button>
    </div>
  </form>
  <p class='muted' data-air-alert-manual>{{7}}</p>
  <p class='muted'>Ручний тест не знижує рівень реальної червоної тривоги.</p>
  <p class='muted'>NEPTUN: неофіційний агрегатор. Допоміжна індикація не замінює офіційні сповіщення. Відсутність даних не означає відбій.</p>
</section>
