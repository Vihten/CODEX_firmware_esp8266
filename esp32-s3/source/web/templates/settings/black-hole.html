<section class='section' aria-labelledby='black-hole-heading'>
<div class='section-head'><h2 id='black-hole-heading'>Чорна діра</h2></div>
<p class='muted'>Відтворити анімацію протягом 60 секунд.</p>
<p data-black-hole-state role='status'>{{0}}</p>
<form method='post' action='/black-hole'><div class='actions'>
<button type='submit' name='mode' value='play' data-black-hole-play {{1}}>Чорна діра · 60 с</button>
<button type='submit' name='mode' value='stop' class='secondary' data-black-hole-stop {{2}}>Зупинити</button>
</div></form>
</section>
